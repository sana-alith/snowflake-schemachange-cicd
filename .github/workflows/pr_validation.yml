name: Validate Snowflake SQL

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - uat
      - main

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install schemachange
      run: pip install schemachange

    - name: Validate migrations
      run: |
        cd schemachange
        schemachange verify --config-folder .

    - name: Check duplicate migration versions
      run: |
        cd schemachange/db_scripts

        duplicates=$(ls V*.sql | sed 's/__.*//' | sort | uniq -d)

        if [ ! -z "$duplicates" ]; then
          echo "Duplicate migration versions detected:"
          echo "$duplicates"
          exit 1
        fi
        
    - name: Check dangerous SQL
      run: |
        cd schemachange/db_scripts

        if grep -i "DROP TABLE" *.sql; then
          echo "DROP TABLE detected. Manual review required."
          exit 1
        fi

        if grep -i "TRUNCATE TABLE" *.sql; then
          echo "TRUNCATE detected. Manual review required."
          exit 1
        fi